name: Docker publish

# Brücke zu AutarkTrade (ab v3.15.0).
#
# Das Crypto Trading Journal wird als AutarkTrade weitergeführt
# (https://github.com/Mouses007/AutarkTrade, Image ghcr.io/mouses007/autarktrade).
# Dieser Workflow baut deshalb KEIN Image mehr aus diesem Repo, sondern spiegelt
# das fertige AutarkTrade-Image (amd64 + arm64, Index unverändert kopiert) unter
# die alten Namen. Bestehende Docker-Installationen bekommen so beim nächsten
# Update AutarkTrade 4.x; die Datenbank (PostgreSQL, DB_*) wird übernommen.
#
#   Tag "v*" gepusht  → mouses007/trading-journal:latest + :<AutarkTrade-Version>
#                       ghcr.io/mouses007/crypto-trading-journal:latest
#   Manuell gestartet → dasselbe (z. B. um eine neue AutarkTrade-Fassung nachzuziehen)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  QUELLE: ghcr.io/mouses007/autarktrade:latest

jobs:
  spiegeln:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Bei Docker Hub anmelden
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bei GitHub-Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: AutarkTrade-Version der Quelle lesen
        id: version
        run: |
          V=$(docker buildx imagetools inspect "$QUELLE" --format '{{ json .Image }}' \
            | jq -r '[.[]?.config.Labels["org.opencontainers.image.version"] // empty] | first // empty' 2>/dev/null || true)
          [ -n "$V" ] || V=$(docker buildx imagetools inspect "$QUELLE" --format '{{ json .Image.Config.Labels }}' 2>/dev/null | jq -r '."org.opencontainers.image.version" // empty' 2>/dev/null || true)
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "Quelle $QUELLE = AutarkTrade ${V:-?}"

      - name: Unter den alten Namen spiegeln
        run: |
          ZIELE="-t mouses007/trading-journal:latest -t ghcr.io/mouses007/crypto-trading-journal:latest"
          if [ -n "${{ steps.version.outputs.version }}" ]; then
            ZIELE="$ZIELE -t mouses007/trading-journal:${{ steps.version.outputs.version }}"
          fi
          docker buildx imagetools create $ZIELE "$QUELLE"
          docker buildx imagetools inspect mouses007/trading-journal:latest

      # Wie bisher: darf das Release nicht rot färben (Token braucht für die
      # Beschreibung mehr als das Push-Recht).
      - name: Docker-Hub-Beschreibung abgleichen
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: mouses007/trading-journal
          short-description: "Continued as AutarkTrade: github.com/Mouses007/AutarkTrade — this tag mirrors ghcr.io/mouses007/autarktrade."
          readme-filepath: ./README.md
