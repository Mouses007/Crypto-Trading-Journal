name: Docker publish

# Baut und veröffentlicht das Container-Image.
#
#   Tag "v*" gepusht  → Release-Build: :3.8.0, :3.8, :3 und :latest
#   Manuell gestartet → Testlauf: nur :edge, rührt :latest NICHT an
#
# Die Versions-Tags sind der eigentliche Zweck: CasaOS verbietet ":latest"
# ausdrücklich, Unraid und Umbrel wollen einen stabilen Tag mit Digest.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Docker Hub nur bespielen, wenn das Token hinterlegt ist. Ohne Token
      # läuft der Build trotzdem durch und landet in der GitHub-Registry —
      # besser als ein roter Lauf, bei dem gar nichts entsteht.
      - name: Ziel-Registries bestimmen
        id: ziele
        env:
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$HUB_TOKEN" ]; then
            echo "images=mouses007/trading-journal,ghcr.io/mouses007/crypto-trading-journal" >> "$GITHUB_OUTPUT"
            echo "hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=ghcr.io/mouses007/crypto-trading-journal" >> "$GITHUB_OUTPUT"
            echo "hub=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_TOKEN fehlt — es wird nur nach ghcr.io veröffentlicht."
          fi

      - name: Tags und Beschriftungen ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ziele.outputs.images }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Crypto Trading Journal
            org.opencontainers.image.description=Self-hosted trading journal for crypto futures (Bitunix, Bitget, Pionex)
            org.opencontainers.image.licenses=GPL-3.0

      # arm64 wird emuliert. Läuft der Schritt "Bauen" länger als ~25 Minuten,
      # lohnt der Umbau auf native ARM-Runner (ubuntu-24.04-arm) — siehe
      # DOCKER-SETUP.md. Vorher nicht optimieren, erst messen.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Bei Docker Hub anmelden
        if: steps.ziele.outputs.hub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bei GitHub-Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Die Docker-Hub-Seite wird von Suchmaschinen indexiert — sie soll
      # denselben Einstiegstext tragen wie das README, nicht leer bleiben.
      #
      # `continue-on-error`, weil dieser Schritt NICHT über den Erfolg des
      # Release entscheidet. Beim ersten Tag-Lauf (v3.9.0) schlug er mit
      # "Forbidden" fehl und meldete den ganzen Lauf rot — obwohl Bauen und
      # Veröffentlichen sauber durchgelaufen waren und die Images auf Docker Hub
      # lagen. Ein roter Haken, der eine funktionierende Veröffentlichung
      # meldet, ist schlimmer als eine nicht abgeglichene Beschreibung.
      #
      # Grund für "Forbidden": Die Beschreibungs-API von Docker Hub verlangt
      # mehr als das Push-Recht. Ein gewöhnliches Zugriffstoken darf Images
      # hochladen, aber die Repository-Beschreibung nicht ändern. Damit dieser
      # Schritt wirklich durchläuft, muss DOCKERHUB_TOKEN ein Token mit
      # Read/Write/Delete-Umfang sein (oder das Kontopasswort).
      #
      # Der Schritt lief bis v3.9.0 nie: er hängt an `refs/tags/v`, und alle
      # vorherigen Läufe waren manuell auf master gestartet.
      - name: Docker-Hub-Beschreibung abgleichen
        if: steps.ziele.outputs.hub == 'true' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: mouses007/trading-journal
          short-description: Self-hosted trading journal for crypto futures — Bitunix, Bitget, Pionex. No cloud, no account.
          readme-filepath: ./README.md
